name: onlinedars

# Default:            docker compose up -d                 -> only PostgreSQL
# With live lessons:  docker compose --profile live up -d  -> + LiveKit, Redis, Egress, MinIO

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Only reachable from this computer, not from the network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on the very first start (empty volume): creates the test database
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- live lessons (profile "live") ----------

  # LiveKit and Egress talk to each other through Redis. Not exposed to the host.
  redis:
    image: redis:7.4-alpine
    profiles: [live]
    restart: unless-stopped

  # WebRTC SFU in development mode. Production: LiveKit Cloud or own server with TLS + TURN.
  livekit:
    image: livekit/livekit-server:v1.13.10
    profiles: [live]
    restart: unless-stopped
    depends_on: [redis]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: false
          # IP that clients use to reach the media ports. 127.0.0.1 = this computer only.
          # Testing from a phone on Wi-Fi: put this computer's LAN IP here and set LIVEKIT_BIND_IP=0.0.0.0
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
        redis:
          address: redis:6379
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - ${LIVEKIT_WEBHOOK_URL:-http://host.docker.internal:8000/webhooks/livekit}
        room:
          empty_timeout: 600
          departure_timeout: 600
    ports:
      - "${LIVEKIT_BIND_IP:-127.0.0.1}:7880:7880"
      - "${LIVEKIT_BIND_IP:-127.0.0.1}:7881:7881"
      - "${LIVEKIT_BIND_IP:-127.0.0.1}:50000-50100:50000-50100/udp"

  # Recorder: headless Chrome joins the room and writes an mp4 into the bucket.
  # Shares LiveKit's network namespace, so it reaches the media ports via 127.0.0.1 too.
  egress:
    image: livekit/egress:v1.15.0
    profiles: [live]
    restart: unless-stopped
    depends_on: [livekit, redis, minio]
    network_mode: "service:livekit"
    cap_add: [SYS_ADMIN]  # needed by Chrome's sandbox inside the container
    shm_size: 1gb  # Chrome crashes or hangs with the default 64 MB /dev/shm
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://localhost:7880
        redis:
          address: redis:6379
        log_level: info
        # Locally LiveKit announces 127.0.0.1 for media; Chrome ignores loopback ICE
        # candidates unless this flag is set (otherwise: "Start signal not received")
        chrome_flags:
          allow-loopback-in-peer-connection: true
          disable-features: WebRtcHideLocalIpsWithMdns

  # S3-compatible temporary storage for raw recordings.
  # The official minio/minio images are no longer published; pgsty/minio is a
  # community build of the same MinIO server. Dev only — production uses S3/R2/etc.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    profiles: [live]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"  # S3 API
      - "127.0.0.1:9001:9001"  # web console
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
